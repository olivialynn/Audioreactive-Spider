<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#15151c;overflow:hidden}</style>
<script type="importmap">{ "imports": {
 "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
 "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
 "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.8/build/index.module.js",
 "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.17/build/index.module.js"
}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeAngel } from './src/creature/CreatureSpec.js';
import { Creature } from './src/creature/Creature.js';
import { ControlBus } from './src/input/ControlBus.js';
const W=1100,H=850; const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(W,H); renderer.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x15151c);
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff,0x222233,1.0));
const key=new THREE.DirectionalLight(0xffffff,2.5); key.position.set(4,7,5); scene.add(key);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x12121a,roughness:0.9})); ground.rotation.x=-Math.PI/2; scene.add(ground);
let err='';
try {
  const creature=new Creature(scene, makeAngel()); creature.placeAt(0,0,0,'circle');
  const bus=new ControlBus();
  const steps=parseInt((location.hash.match(/s(\d+)/)||[])[1]||'80');
  for(let i=0;i<steps;i++) creature.update(1/60, bus);
} catch(e){ err=e.message; document.body.innerHTML='<pre style="color:#f88;font:14px monospace;padding:20px;white-space:pre-wrap">CSG ERROR: '+e.message+'\n'+e.stack+'</pre>'; }
if(!err){
  const cam=new THREE.PerspectiveCamera(45,W/H,0.1,100);
  cam.position.set(2.4,0.7,2.4), cam.lookAt(new THREE.Vector3(0,0.35,0));
  renderer.render(scene,cam);
}
document.title='ready';
</script></body></html>
